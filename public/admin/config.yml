- name: services
  label: Услуги — содержание
  folder: src/content/services
  i18n: true
  create: false
  extension: md
  format: frontmatter
  editor:
    preview: false
  fields:
  - name: title
    label: Заголовок
    i18n: true
    widget: string
  - name: order
    label: Порядок
    i18n: duplicate
    widget: number
    value_type: int
  - name: anchor
    label: Якорь на странице услуг
    i18n: duplicate
    widget: string
  - name: icon
    label: Иконка
    i18n: duplicate
    widget: select
    options: *id002
  - name: partner
    label: Партнёр
    i18n: true
    widget: string
    required: false
    default: ''
  - name: items
    label: Пункты
    i18n: true
    widget: list
    field:
      name: value
      label: Текст
      widget: text
      i18n: true
  - name: body
    label: Дополнительный текст
    widget: markdown
    i18n: true
    required: false
  - name: archived
    label: Архив — не показывать на сайте
    widget: boolean
    i18n: duplicate
    default: false
  - name: partnerId
    label: Партнёр (для активных услуг)
    widget: select
    i18n: duplicate
    options:
    - naip
    - retail
    required: false
- name: system
  label: Общие подключения и служебное
  i18n: false
  editor:
    preview: false
  files:
  - name: integrations
    label: 'Подключения: формы и аналитика'
    file: src/content/system/integrations.json
    fields:
    - name: googleAnalyticsId
      label: Google Analytics — Measurement ID
      widget: string
      required: false
      default: ''
      hint: Публичный ID вида G-… из вашего Google Analytics. Пусто = аналитика отключена.
    - name: contactFormEndpoint
      label: HTTPS-обработчик формы
      widget: string
      required: false
      default: ''
      hint: Например, https://formspree.io/f/ВАШ_ID. Это публичный URL формы, не пароль и не API-ключ. Пусто = отправка отключена.
    - name: registrationUrl
      label: Ссылка внешней регистрации (Zoom или Google Forms)
      widget: string
      required: false
      default: ''
      hint: Если заполнено, кнопки регистрации ведут на эту страницу (например, регистрация встречи в Zoom). Пусто = работает встроенная форма сайта через registrationFormEndpoint.
    - name: registrationFormEndpoint
      label: HTTPS-обработчик регистрации на семинар
      widget: string
      required: false
      default: ''
      hint: PUBLIC_REGISTRATION_FORM_ENDPOINT. Если пусто, используется обработчик контактной формы. Нужен ответ JSON {ok:true}
        или {success:true}; секретные ключи здесь не хранить.
  - name: seminar
    label: Семинар — дата и время
    file: src/content/system/seminar.json
    fields:
    - name: startAt
      label: Начало семинара (ISO с часовым поясом)
      widget: string
      hint: 'Пример: 2026-10-01T10:00:00+02:00. Обязательно указывайте UTC-смещение для даты мероприятия.'
    - name: durationMinutes
      label: Продолжительность в минутах
      widget: number
      value_type: int
      min: 1
      max: 1440
    - name: timeZone
      label: Часовой пояс IANA
      widget: string
    - name: registrationDeadline
      label: Последний момент регистрации (ISO с часовым поясом)
      widget: string
      hint: 'Пример: 2026-09-28T23:59:59+02:00. Последний разрешённый момент регистрации; должен быть раньше начала.'
  - name: blocks
    label: Каталог блоков
    file: src/content/system/blocks.json
    description: Справочник по блокам. Сами показы блоков живут в коде — здесь правятся только описания и ваши пометки.
    fields:
    - name: seo
      label: Для поисковиков
      widget: object
      collapsed: true
      fields:
      - name: title
        label: Заголовок вкладки
        widget: string
      - name: description
        label: Описание
        widget: text
    - name: title
      label: Заголовок страницы
      widget: string
    - name: lead
      label: Вводный абзац
      widget: text
    - name: mediaNote
      label: Примечание про фото и видео
      widget: text
      hint: Про то, что снимки временные
    - name: serviceNote
      label: Примечание про служебность
      widget: text
    - name: youtube
      label: Ролик для блока «Видео с YouTube»
      widget: object
      fields:
      - name: videoId
        label: Код ролика
        widget: string
        required: false
        hint: Из ссылки youtube.com/watch?v=ЭТА_ЧАСТЬ — например FZdbKedYpqc. Пустое поле вернёт заглушку
      - name: poster
        label: Обложка
        widget: image
        required: false
        hint: Своя обложка лучше. Пока её нет, браузер тянет картинку с серверов YouTube ещё до нажатия «play»
      - name: title
        label: Название ролика
        widget: string
        required: false
      - name: caption
        label: Подпись под роликом
        widget: text
        required: false
    - name: blocks
      label: Блоки
      widget: list
      label_singular: Блок
      summary: '{{fields.name}}{{fields.note}}'
      allow_add: false
      fields:
      - name: id
        label: Код блока
        widget: string
        hint: Связывает описание с показом. Менять нельзя — блок пропадёт
      - name: name
        label: Название
        widget: string
      - name: when
        label: Когда нужен
        widget: text
      - name: needs
        label: Что нужно от вас
        widget: text
        required: false
      - name: note
        label: Ваша пометка
        widget: text
        required: false
        hint: 'Например: берём на страницу услуг. Пустое поле не показывается'
  - name: notfound
    label: Страница «не найдено»
    file: src/content/system/notfound.json
    description: Показывается, если посетитель ошибся в адресе. Фраза идёт на всех трёх языках сразу — какой нужен, заранее
      неизвестно.
    fields:
    - name: seo
      label: Для поисковиков
      widget: object
      collapsed: true
      fields:
      - name: title
        label: Заголовок вкладки
        widget: string
      - name: description
        label: Описание
        widget: text
    - name: texts
      label: Текст по языкам
      widget: list
      label_singular: Язык
      summary: '{{fields.code}}: {{fields.text}}'
      allow_add: false
      fields:
      - name: code
        label: Язык
        widget: select
        options:
        - label: Русский
          value: ru
        - label: Italiano
          value: it
        - label: English
          value: en
      - name: text
        label: Фраза
        widget: text
  - name: design
    label: Единственный макет — Balance
    file: src/content/system/design.json
    fields:
    - name: defaultDesign
      label: Макет
      widget: hidden
      default: balance
    - name: showSwitcher
      label: Переключатель отключён
      widget: hidden
      default: false
