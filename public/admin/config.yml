# Поля синхронизированы с src/content.config.ts. Макет Balance фиксирован.
backend:
  name: github
  repo: Mikita-Hubanau/vikoma-group
  branch: main
media_folder: src/assets/media
public_folder: /media
site_url: https://mikita-hubanau.github.io/vikoma-group
i18n:
  structure: multiple_folders
  locales:
  - it
  - en
  - ru
  default_locale: it
collections:
- name: settings
  label: Общее
  icon: settings
  i18n: true
  editor:
    preview: false
  files:
  - name: contacts
    label: Компания, контакты и партнёры
    file: src/content/settings/{{locale}}.json
    i18n: true
    fields:
    - name: company
      label: Компания
      i18n: true
      widget: object
      fields:
      - name: name
        label: Имя / название
        i18n: true
        widget: string
      - name: tagline
        label: Слоган
        i18n: duplicate
        widget: string
        hint: 'Единый слоган на всех языках: Italy meets Eurasia'
    - name: email
      label: Email
      i18n: duplicate
      widget: string
      required: false
      default: ''
    - name: phones
      label: Общие телефоны (необязательно)
      i18n: true
      widget: list
      fields:
      - name: label
        label: Подпись
        i18n: true
        widget: string
        required: true
      - name: display
        label: Телефон для показа
        i18n: duplicate
        widget: string
        required: true
      - name: tel
        label: 'Номер для звонка: + и цифры'
        i18n: duplicate
        widget: string
        required: true
        pattern:
        - ^\+[0-9]{7,15}$
        - Плюс и 7–15 цифр; удалите всю строку, если телефона нет
      required: false
    - name: offices
      label: Офисы
      i18n: true
      widget: list
      fields:
      - name: id
        label: Идентификатор
        i18n: duplicate
        widget: string
      - name: title
        label: Заголовок
        i18n: true
        widget: string
      - name: city
        label: Город
        i18n: true
        widget: string
      - name: person
        label: Контактное лицо
        i18n: true
        widget: string
      - name: address
        label: Полный адрес (больше не публикуется)
        i18n: true
        widget: hidden
        required: false
        default: ''
      - name: note
        label: Примечание / страна
        i18n: true
        widget: string
      - name: phone
        label: Телефон для показа
        i18n: duplicate
        widget: string
        required: false
        default: ''
      - name: tel
        label: 'Номер для звонка: + и цифры'
        i18n: duplicate
        widget: string
        required: false
        default: ''
        pattern:
        - ^(\+[0-9]{7,15})?$
        - Плюс и 7–15 цифр либо пустое поле
      - name: email
        label: Email
        i18n: duplicate
        widget: string
        required: false
        default: ''
      summary: '{{fields.title}}'
      min: 2
      max: 2
      allow_add: false
    - name: legal
      label: Реальные реквизиты (необязательно)
      i18n: true
      widget: list
      fields:
      - name: label
        label: Подпись
        i18n: true
        widget: string
        required: true
      - name: value
        label: Значение
        i18n: true
        widget: string
        required: true
      required: false
    - name: socials
      label: Социальные сети
      i18n: true
      widget: list
      fields:
      - name: type
        label: Тип
        i18n: duplicate
        widget: select
        options:
        - linkedin
        - telegram
      - name: label
        label: Подпись
        i18n: true
        widget: string
      - name: href
        label: Внешняя ссылка
        i18n: duplicate
        widget: string
        required: false
        default: ''
      summary: '{{fields.label}}'
      min: 2
      max: 2
      allow_add: false
    - name: partners
      label: Партнёры — общие для главной и О нас
      i18n: true
      widget: list
      fields:
      - name: id
        label: Идентификатор
        i18n: duplicate
        widget: string
      - name: shortName
        label: Короткое название
        i18n: true
        widget: string
      - name: name
        label: Имя / название
        i18n: true
        widget: string
      - name: icon
        label: Иконка
        i18n: duplicate
        widget: select
        options: &id002
        - chart
        - store
        - scales
        - card
        - network
        - building
      - name: description
        label: Описание
        i18n: true
        widget: text
      - name: logo
        label: Логотип партнёра (не используется в текстовых блоках)
        i18n: duplicate
        widget: hidden
        required: false
        default: ''
        hint: Загрузите реальный файл. Пустое поле не создаёт вымышленное изображение.
      - name: href
        label: Внешняя ссылка
        i18n: duplicate
        widget: string
        required: false
        default: ''
      summary: '{{fields.name}}'
      min: 2
      max: 2
      allow_add: false
      hint: 'Два партнёра из подтверждённого списка ТЗ: НАИП и СДЕЛКИ В ПЛЮС.'
